# Data Ingestion and Validation Configuration
provider:
  name: "synthetic"  # "synthetic" or "yfinance" or "csv"
  timezone: "UTC"
  bar_interval: "5m"

universe:
  assets:
    - "ASSET_00"
    - "ASSET_01"
    - "ASSET_02"
    - "ASSET_03"
    - "ASSET_04"
    - "ASSET_05"
    - "ASSET_06"
    - "ASSET_07"
    - "ASSET_08"
    - "ASSET_09"

synthetic_generator:
  num_assets: 10
  num_sessions: 60
  bars_per_session: 78    # 6.5 hours of trading at 5m bars = 78 bars/session
  start_date: "2024-01-02"
  seed: 42
  base_annual_volatility: 0.25
  regime_switch_prob: 0.05
  autocorrelation_coeff: 0.03
  volume_mean: 50000.0

validation:
  check_missing_columns: true
  check_monotonic_time: true
  check_duplicates: true
  check_positive_prices: true
  check_positive_volume: true
  check_ohlc_consistency: true
  max_log_return_deviation: 0.15   # 15% 5-minute price swing sanity limit
  flag_stale_prices: true
  stale_price_window: 10

storage:
  raw_dir: "data/raw"
  synthetic_dir: "data/synthetic"
  processed_dir: "data/processed"
  format: "parquet"
  partition_cols: ["asset_id"]
